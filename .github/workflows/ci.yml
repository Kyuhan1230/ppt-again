name: Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    # Browser and worker integration tests run serially on Windows.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Each file launches browsers and worker observers; parallel files can
      # exhaust a hosted runner and trip the application's resource watchdog.
      - run: node --test --test-concurrency=1 tests/*.test.mjs
        id: tests
      - name: Report sanitized test errors
        if: failure() && steps.tests.outcome == 'failure'
        run: node scripts/report-ci-errors.mjs
      - name: Package verified source
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: git archive --format=zip --output=ppt-again-source.zip HEAD
      - name: Save verified source package
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ppt-again-source
          path: ppt-again-source.zip
          retention-days: 14
          if-no-files-found: error
